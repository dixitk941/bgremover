<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Your Image - Background Remover</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #5C4EFA;
            --primary-hover: #4B3ED9;
            --primary-light: #EEF2FF;
            --secondary: #FF6B6B;
            --dark: #1A1A2E;
            --gray-900: #111827;
            --gray-800: #1f2937;
            --gray-700: #374151;
            --gray-600: #4b5563;
            --gray-500: #6b7280;
            --gray-400: #9ca3af;
            --gray-300: #d1d5db;
            --gray-200: #e5e7eb;
            --gray-100: #f3f4f6;
            --gray-50: #f9fafb;
            --white: #ffffff;
            --success: #10b981;
            --success-light: #D1FAE5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #F8F7FF 0%, #EEF2FF 50%, #F8F7FF 100%);
            min-height: 100vh;
            color: var(--gray-900);
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gray-200);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--gray-900);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), #8B5CF6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--gray-700);
        }

        .btn-ghost:hover {
            background: var(--gray-100);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Main Content */
        .main-content {
            padding: 100px 24px 60px;
            min-height: 100vh;
        }

        .result-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Success Header */
        .success-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .success-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--success-light);
            color: var(--success);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .success-badge svg {
            width: 18px;
            height: 18px;
        }

        .success-title {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .success-subtitle {
            font-size: 1.125rem;
            color: var(--gray-600);
        }

        /* Image Comparison */
        .comparison-section {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 0 0 1px var(--gray-200);
            overflow: hidden;
            margin-bottom: 32px;
        }

        .comparison-header {
            display: flex;
            border-bottom: 1px solid var(--gray-200);
        }

        .comparison-tab {
            flex: 1;
            padding: 16px 24px;
            text-align: center;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
        }

        .comparison-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--primary-light);
        }

        .comparison-tab:hover:not(.active) {
            background: var(--gray-50);
        }

        .comparison-content {
            padding: 24px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .image-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--gray-100);
        }

        .image-card.processed {
            /* Checkerboard pattern for transparency */
            background-image: 
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .image-label {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 10;
        }

        .image-card img {
            width: 100%;
            height: 400px;
            object-fit: contain;
            display: block;
        }

        /* Single View */
        .single-view {
            display: none;
        }

        .single-view.active {
            display: block;
        }

        .single-image-container {
            border-radius: 16px;
            overflow: hidden;
            max-width: 700px;
            margin: 0 auto;
        }

        .single-image-container.transparent-bg {
            background-image: 
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .single-image-container img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .comparison-view {
            display: block;
        }

        .comparison-view.hidden {
            display: none;
        }

        /* Actions */
        .actions-section {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 0 0 1px var(--gray-200);
            padding: 32px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, var(--primary), #8B5CF6);
            color: white;
            box-shadow: 0 4px 16px rgba(92, 78, 250, 0.3);
        }

        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(92, 78, 250, 0.4);
        }

        .action-btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .action-btn-secondary:hover {
            background: var(--gray-200);
        }

        .action-btn-success {
            background: var(--success);
            color: white;
        }

        .action-btn-success:hover {
            background: #059669;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .quick-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--gray-600);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .quick-action:hover {
            color: var(--primary);
        }

        .quick-action:hover .quick-action-icon {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .quick-action-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--gray-100);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .quick-action-icon svg {
            width: 24px;
            height: 24px;
        }

        .quick-action-label {
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .success-title {
                font-size: 1.75rem;
            }

            .image-grid {
                grid-template-columns: 1fr;
            }

            .image-card img {
                height: 300px;
            }

            .actions-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                BGRemover
            </a>

            <div class="nav-actions">
                <a href="/upload" class="btn btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    New Image
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="result-container">
            <!-- Success Header -->
            <div class="success-header">
                <div class="success-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Background Removed Successfully
                </div>
                <h1 class="success-title">Your image is ready!</h1>
                <p class="success-subtitle">Download your transparent PNG or continue editing</p>
            </div>

            <!-- Image Comparison -->
            <div class="comparison-section">
                <div class="comparison-header">
                    <div class="comparison-tab active" data-view="compare">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 6px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
                        </svg>
                        Compare
                    </div>
                    <div class="comparison-tab" data-view="original">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 6px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        Original
                    </div>
                    <div class="comparison-tab" data-view="result">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 6px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Result
                    </div>
                </div>
                <div class="comparison-content">
                    <!-- Compare View -->
                    <div class="comparison-view" id="compare-view">
                        <div class="image-grid">
                            <div class="image-card">
                                <span class="image-label">Original</span>
                                <img src="{{ original_url }}" alt="Original image">
                            </div>
                            <div class="image-card processed">
                                <span class="image-label">Processed</span>
                                <img src="{{ processed_url }}" alt="Processed image">
                            </div>
                        </div>
                    </div>

                    <!-- Original View -->
                    <div class="single-view" id="original-view">
                        <div class="single-image-container">
                            <img src="{{ original_url }}" alt="Original image">
                        </div>
                    </div>

                    <!-- Result View -->
                    <div class="single-view" id="result-view">
                        <div class="single-image-container transparent-bg">
                            <img src="{{ processed_url }}" alt="Processed image">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions-section">
                <div class="actions-grid">
                    <a href="{{ download_url }}" download="{{ filename }}" class="action-btn action-btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Download PNG
                    </a>
                    <a href="/upload" class="action-btn action-btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Remove Another
                    </a>
                    <a href="{{ original_url }}" download="original.png" class="action-btn action-btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        Download Original
                    </a>
                </div>

                <!-- Quick Actions -->
                <div class="quick-actions">
                    <a href="/" class="quick-action">
                        <div class="quick-action-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                        </div>
                        <span class="quick-action-label">Home</span>
                    </a>
                    <a href="#" class="quick-action" onclick="shareImage()">
                        <div class="quick-action-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                            </svg>
                        </div>
                        <span class="quick-action-label">Share</span>
                    </a>
                    <a href="#" class="quick-action" onclick="copyToClipboard()">
                        <div class="quick-action-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <span class="quick-action-label">Copy Link</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Tab switching
        const tabs = document.querySelectorAll('.comparison-tab');
        const compareView = document.getElementById('compare-view');
        const originalView = document.getElementById('original-view');
        const resultView = document.getElementById('result-view');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs
                tabs.forEach(t => t.classList.remove('active'));
                // Add active class to clicked tab
                tab.classList.add('active');

                // Hide all views
                compareView.classList.add('hidden');
                compareView.classList.remove('comparison-view');
                originalView.classList.remove('active');
                resultView.classList.remove('active');

                // Show selected view
                const view = tab.dataset.view;
                if (view === 'compare') {
                    compareView.classList.remove('hidden');
                    compareView.classList.add('comparison-view');
                } else if (view === 'original') {
                    originalView.classList.add('active');
                } else if (view === 'result') {
                    resultView.classList.add('active');
                }
            });
        });

        // Share functionality
        function shareImage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Check out my background-removed image!',
                    text: 'I just removed the background from my image using BGRemover!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                copyToClipboard();
            }
        }

        // Copy to clipboard
        function copyToClipboard() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
    </script>
</body>
</html>
